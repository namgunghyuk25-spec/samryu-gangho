<style>

:root { --ink: #ffffff; --dim: #a8b0d8; --gold: #ffd860; --red: #ff6070; --line: #f0f0f8; }

  border: 2px solid #f4ecd8; border-radius: 3px; outline: 1px solid #08081c; box-shadow: inset 0 0 0 1px #8a98ec, inset 0 1px 0 2px rgba(255,255,255,.10), 2px 2px 0 1px rgba(0,0,8,.4); }

.opt { position: relative; padding-left: 9px; min-height: 14px; white-space: nowrap; cursor: pointer; }

.utag .sts { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 1px; margin-top: 1px; text-shadow: 1px 0 #000, 0 1px #000, -1px 0 #000, 0 -1px #000; white-space: nowrap; }

.bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.bar i.lag { background: #fff0b0; } .bar.hp i { background: linear-gradient(#a0ffa0, #30a848); } .bar.qi i { background: linear-gradient(#a8d8ff, #3068e0); } .bar.gg i { background: linear-gradient(#fff0a0, #e89818); }
.skwin { display: grid; grid-template-columns: 1fr 1fr; align-content: start; column-gap: 6px; }

@keyframes gmIn { 0% { transform: scaleY(0); opacity: 0; } 5% { transform: scaleY(1); opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
.banner.big { font-size: 24px; line-height: 26px; top: 84px; letter-spacing: 4px; color: var(--gold); }
.banner.red { color: var(--red); }
@keyframes bannerIn { 0% { transform: scaleY(0); opacity: 0; } 12% { transform: scaleY(1.3); opacity: 1; } 22% { transform: scaleY(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.cutin { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
.cutin .band { position: absolute; left: 0; top: 78px; width: 320px; height: 44px; display: flex; align-items: center; gap: 10px; padding-left: 40px; box-sizing: border-box;
  background: linear-gradient(90deg, rgba(0,0,0,.0), #0a1030 15%, #1a3080 50%, #0a1030 85%, rgba(0,0,0,0)); border-top: 2px solid #c0d8ff; border-bottom: 2px solid #c0d8ff; animation: cut .75s ease-out forwards; }

@keyframes cut { 0% { transform: translateX(320px) skewX(-20deg); } 20% { transform: translateX(-6px) skewX(0); } 30% { transform: translateX(0); } 85% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-80px); } }
.pop { position: absolute; transform: translate(-50%, -50%); font: 12px G11B; color: #fff; white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000, 1px 1px #000; animation: pop .85s ease-out forwards; }
.pop.crit { color: var(--gold); font-size: 12px; animation: popc .9s ease-out forwards; }
.pop.hurt { color: #ff9090; } .pop.heal { color: #80ff90; } .pop.qi { color: #90c8ff; } .pop.miss { color: #c0c0d0; font: 10px G9; }
.pop.st { color: #ffe880; font: 10px G9; } .pop.poison { color: #80ff80; font: 10px G9; } .pop.dot { color: #c0ffa0; } .pop.warn { color: #ff5050; font: 10px G9; animation-duration: 1.1s; }
@keyframes pop { 0% { transform: translate(-50%, -30%) scale(1.5); } 15% { transform: translate(-50%, -80%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -110%); } 100% { opacity: 0; transform: translate(-50%, -130%); } }
